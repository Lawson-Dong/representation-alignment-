name: Research checks
on:
  push:
    branches: [representation-vector-geometric-dynamics]
  pull_request:
    paths: ['experiments/geometric_dynamics/**', '.github/workflows/research-checks.yml']
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<4'
      - run: python -m unittest discover -s experiments/geometric_dynamics/tests -v
